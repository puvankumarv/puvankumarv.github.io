<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puvan Kumar V</title>
  <meta name="description" content="Portfolio of Puvan Kumar V, software developer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f3ef;
      --ink: #141413;
      --grey: #84847a;
      --rule: #d6d4cd;
      --accent: #1c5cec;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #121211;
        --ink: #ecebe6;
        --grey: #8a8a82;
        --rule: #2b2b29;
        --accent: #5b8bff;
      }
    }
    :root[data-theme="dark"] {
      --paper: #121211;
      --ink: #ecebe6;
      --grey: #8a8a82;
      --rule: #2b2b29;
      --accent: #5b8bff;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter Tight", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding-inline: clamp(16px, 4vw, 48px);
    }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-block: 20px;
      border-bottom: 1px solid var(--rule);
    }
    header .mark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }

    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--grey); }
    .status::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .hero {
      align-self: end;
      padding-block: clamp(48px, 10vh, 120px) clamp(24px, 4vh, 40px);
    }
    .hero .label { color: var(--grey); margin-bottom: 20px; }
    .hero .label b { color: var(--accent); font-weight: 500; }

    h1 {
      font-weight: 500;
      font-size: clamp(3.2rem, 13vw, 11.5rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
      word-spacing: 0.06em;
      margin-left: -0.04em;
    }

    footer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding-block: 20px;
      border-top: 1px solid var(--rule);
      color: var(--grey);
    }
    footer span:nth-child(2) { text-align: center; }
    footer span:last-child { text-align: right; }
    footer .role { color: var(--ink); }

    @media (max-width: 560px) {
      footer { grid-template-columns: 1fr 1fr; }
      footer span:nth-child(2) { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="mark">PKV</span>
      <span class="status mono">Portfolio in progress</span>
    </header>

    <main class="hero">
      <p class="label mono"><b>//</b> Hello, I'm</p>
      <h1>Puvan<br>Kumar V</h1>
    </main>

    <footer class="mono">
      <span class="role">Software Developer</span>
      <span>Index — 001</span>
      <span>© 2026</span>
    </footer>
  </div>
</body>
</html>
